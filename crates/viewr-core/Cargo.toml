[package]
name = "viewr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
benchmarks = ["dep:criterion"]

[dependencies]
rawler.workspace = true
chrono.workspace = true
rayon.workspace = true
thiserror.workspace = true
image.workspace = true
fast_image_resize.workspace = true
jpeg-rusturbo.workspace = true
zune-jpeg.workspace = true
memchr.workspace = true
rusqlite.workspace = true
blake3.workspace = true
quick-xml.workspace = true
dirs.workspace = true
icu_casemap.workspace = true
icu_normalizer.workspace = true
tempfile.workspace = true
criterion = { workspace = true, optional = true }

[dev-dependencies]
# rawler's JPEG-XL decoder uses this abstraction. Keep a direct regression
# test that its ambient Rayon mode inherits Viewr's configured pool.
jxl-threadpool = { version = "=1.0.0", features = ["rayon"] }

[[bench]]
name = "core_hot_paths"
harness = false
required-features = ["benchmarks"]
