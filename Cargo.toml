[workspace]
resolver = "3"
members = ["crates/viewr-core", "crates/viewr-app"]

[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/hunterchen7/viewr"

[workspace.dependencies]
viewr-core = { path = "crates/viewr-core" }
# rawler is not semver-stable yet — pin exactly; upgrades are deliberate events.
rawler = "=0.7.2"
rayon = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
fast_image_resize = "6"
anyhow = "1"
eframe = "0.35"
rfd = "0.15"
objc2 = "0.6"
raw-window-handle = "0.6"
jpeg-encoder = { version = "0.6", features = ["simd"] }
zune-jpeg = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
quick-xml = "0.36"
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = "thin"

# Keep our own code fast to compile, but dependencies (rawler, zune, eframe)
# optimized even in dev builds — raw decode is unusable at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
