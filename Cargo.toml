[workspace]
resolver = "3"
members = ["crates/viewr-core", "crates/viewr-app"]

[workspace.package]
version = "0.3.0" # x-release-please-version
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/hunterchen7/viewr"

[workspace.dependencies]
viewr-core = { path = "crates/viewr-core" }
# rawler is not semver-stable yet — pin exactly; upgrades are deliberate events.
rawler = "=0.7.2"
rayon = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
fast_image_resize = "6"
anyhow = "1"
eframe = { version = "0.35", features = ["persistence"] }
rfd = "0.15"
objc2 = "0.6"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }
jpeg-rusturbo = "0.9.2"
zune-jpeg = "0.5"
memchr = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
quick-xml = "0.36"
dirs = "5"
icu_casemap = "2.2"
icu_normalizer = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
toml = "0.8"
tempfile = "3.27"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"
criterion = { version = "0.8", features = ["html_reports"] }
chrono = "0.4.45"

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"

# Keep our own code fast to compile, but dependencies (rawler, zune, eframe)
# optimized even in dev builds — raw decode is unusable at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Unit and integration tests prioritize compile latency. Performance-sensitive
# behavior is measured separately with the optimized benchmark profile.
[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 0
