# Builds, validates, and attaches versioned archives and native installers to
# a draft release. A normal release becomes public only after every check
# passes. A manual rebuild of an older tag remains a verified draft so a
# workflow-authorized maintainer can publish it.
name: Release binaries
run-name: Release binaries for ${{ inputs.release_tag }}
on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing draft release tag to build and publish or recover
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to build and publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate release request
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      historical_recovery: ${{ steps.release_commit.outputs.historical }}
      release_id: ${{ steps.draft_release.outputs.id }}
      release_sha: ${{ steps.release_commit.outputs.sha }}
    permissions:
      actions: read
      # GitHub exposes draft releases only to tokens with push access.
      contents: write
    steps:
      - name: Validate release request
        env:
          WORKFLOW_REF: ${{ github.ref }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$VIEWR_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag is not a stable semantic version: $VIEWR_RELEASE_TAG"
            exit 1
          fi
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Release workflows must run from main, not $WORKFLOW_REF."
            exit 1
          fi
      - name: Check out current release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
      - name: Require an existing draft release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_id="$(
            scripts/require-draft-release.sh \
              "$VIEWR_RELEASE_TAG"
          )"
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
      - name: Match workflow provenance to the release tag
        id: release_commit
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          release_sha="$(git -C release-source rev-parse HEAD)"
          historical=false
          if [[ "$release_sha" != "$WORKFLOW_SHA" ]]; then
            if [[ "$WORKFLOW_EVENT" != "workflow_dispatch" ]]; then
              echo "::error::Workflow commit $WORKFLOW_SHA does not match release commit $release_sha."
              exit 1
            fi
            historical=true
            echo "::notice::Using main workflow $WORKFLOW_SHA to recover release commit $release_sha."
          fi
          printf 'historical=%s\n' "$historical" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          ci_run_id=""
          for _ in $(seq 1 60); do
            if ! ci_run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --branch main \
                --commit "$RELEASE_SHA" \
                --event push \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"; then
              echo "::warning::Could not query CI yet; retrying."
              ci_run_id=""
            fi
            if [[ -n "$ci_run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$ci_run_id" ]]; then
            echo "::error::No main-branch CI run exists for release commit $RELEASE_SHA."
            exit 1
          fi
          gh run watch \
            "$ci_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10

  packages:
    name: Release assets (${{ matrix.platform }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            archive: viewr-macos-arm64.tar.gz
            portable_platform: macos-arm64
            rustflags: ''
          - platform: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: viewr-windows-x64.zip
            portable_platform: windows-x64
            rustflags: -C target-feature=+crt-static
          - platform: Debian x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: viewr-linux-x64.tar.gz
            portable_platform: linux-x64
            rustflags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - name: Linux build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            jq \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libvulkan1 \
            lintian \
            nasm \
            shared-mime-info \
            xdg-utils
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
        with:
          targets: ${{ matrix.target }}
      - name: Build Viewr
        id: build_viewr
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p viewr --bin viewr
      - name: Build and validate portable archive
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.build_viewr.outcome == 'success' }}
        shell: bash
        run: |
          scripts/package-portable-archive.sh \
            --platform "${{ matrix.portable_platform }}" \
            --binary "target/${{ matrix.target }}/release/viewr" \
            --output "dist/${{ matrix.archive }}"
          scripts/validate-portable-archive.sh \
            --platform "${{ matrix.portable_platform }}" \
            --archive "dist/${{ matrix.archive }}" \
            --expected-binary "target/${{ matrix.target }}/release/viewr"
      - name: Build and validate Windows portable archive
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_viewr.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/package-portable-archive.ps1 `
            -Platform "${{ matrix.portable_platform }}" `
            -BinaryPath "target/${{ matrix.target }}/release/viewr.exe" `
            -OutputPath "dist/${{ matrix.archive }}"
          ./scripts/validate-portable-archive.ps1 `
            -Platform "${{ matrix.portable_platform }}" `
            -ArchivePath "dist/${{ matrix.archive }}" `
            -ExpectedBinaryPath "target/${{ matrix.target }}/release/viewr.exe"
      - name: Build and validate macOS installer
        id: macos_installer
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build_viewr.outcome == 'success' }}
        shell: bash
        env:
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          scripts/package-macos-pkg.sh \
            target/${{ matrix.target }}/release/viewr \
            dist/viewr-macos-arm64.pkg
          scripts/validate-macos-pkg.sh \
            --test-open-events \
            dist/viewr-macos-arm64.pkg
      - name: Install and remove macOS installer
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.macos_installer.outcome == 'success' }}
        shell: bash
        env:
          VIEWR_TEST_RAW: ${{ runner.temp }}/viewr-public-domain-sony.ARW
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            https://raw.pixls.us/data/Sony/DSC-RX100/DSC00838.ARW \
            --output "$VIEWR_TEST_RAW"
          printf '%s  %s\n' \
            579a485b5126a25cbd55cbd5dadfa7d09cf021c99cc7d4869f9e56e3f759390b \
            "$VIEWR_TEST_RAW" |
            shasum -a 256 --check -
          scripts/test-macos-pkg-install.sh \
            --allow-system-changes \
            dist/viewr-macos-arm64.pkg
      - name: Build and validate Windows installer
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build_viewr.outcome == 'success' }}
        shell: pwsh
        env:
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ./scripts/build-windows-msi.ps1 `
            -BinaryPath "target/${{ matrix.target }}/release/viewr.exe" `
            -OutputDirectory dist `
            -ReleaseTag $env:VIEWR_RELEASE_TAG
          ./scripts/test-windows-msi.ps1 `
            -MsiPath dist/viewr-windows-x64.msi `
            -ExpectedBinaryPath "target/${{ matrix.target }}/release/viewr.exe" `
            -AllowMachineChanges
      - name: Build and validate Debian installer
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build_viewr.outcome == 'success' }}
        shell: bash
        env:
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          scripts/package-linux-deb.sh \
            --binary target/${{ matrix.target }}/release/viewr \
            --output-dir dist \
            --release-tag "$VIEWR_RELEASE_TAG"
          scripts/validate-linux-deb.sh dist/viewr-linux-x64.deb
          scripts/test-linux-deb-install.sh \
            --allow-system-changes \
            dist/viewr-linux-x64.deb
      - name: Upload platform assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  source:
    name: Release source
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - name: Linux source-validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            jq \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            nasm \
            pkg-config
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
      - name: Install license inventory tool
        run: cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Fetch all release target dependency graphs
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-pc-windows-msvc
          cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Validate third-party license inventories
        run: scripts/validate-third-party-licenses.sh
      - name: Build and validate vendored source archive
        env:
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          scripts/package-source-archive.sh dist
          scripts/validate-source-archive.sh dist/viewr-*-source.tar.gz
      - name: Upload source asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: [gate, packages, source]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Validate release mode
        env:
          HISTORICAL_RECOVERY: ${{ needs.gate.outputs.historical_recovery }}
        run: |
          case "$HISTORICAL_RECOVERY" in
            true | false) ;;
            *)
              echo "::error::Invalid historical recovery mode: $HISTORICAL_RECOVERY"
              exit 1
              ;;
          esac
      - name: Check out current release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          path: release-source
          persist-credentials: false
      - name: Require release to remain the same draft
        env:
          GH_TOKEN: ${{ github.token }}
          VIEWR_RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
          VIEWR_RELEASE_QUERY_ATTEMPTS: "1"
        run: |
          scripts/require-draft-release.sh \
            "$VIEWR_RELEASE_TAG" \
            "$VIEWR_RELEASE_ID" >/dev/null
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify assets and write checksums
        env:
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          scripts/verify-release-assets.sh \
            --manifest "$GITHUB_WORKSPACE/release-source/Cargo.toml" \
            dist \
            "$VIEWR_RELEASE_TAG"
      - name: Reject unexpected existing release assets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIEWR_RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify-remote-release-assets.sh \
            --allow-missing \
            --release-id "$VIEWR_RELEASE_ID" \
            dist \
            "$VIEWR_RELEASE_TAG"
      - name: Write historical recovery attestation predicate
        if: ${{ needs.gate.outputs.historical_recovery == 'true' }}
        env:
          RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson release_id "$RELEASE_ID" \
            --arg release_sha "$RELEASE_SHA" \
            --arg release_tag "$RELEASE_TAG" \
            --arg run_url \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            '{
              schemaVersion: 1,
              release: {
                repository: $repository,
                id: $release_id,
                tag: $release_tag,
                sourceCommit: $release_sha
              },
              workflow: {
                ref: $workflow_ref,
                commit: $workflow_sha,
                run: $run_url
              }
            }' >"$RUNNER_TEMP/viewr-release-recovery-predicate.json"
      - name: Attest release assets
        if: ${{ needs.gate.outputs.historical_recovery == 'false' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest checksum manifest
        if: ${{ needs.gate.outputs.historical_recovery == 'false' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Attest historical recovery assets
        if: ${{ needs.gate.outputs.historical_recovery == 'true' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: dist/SHA256SUMS
          predicate-type: https://github.com/hunterchen7/viewr/attestations/release-recovery/v1
          predicate-path: ${{ runner.temp }}/viewr-release-recovery-predicate.json
      - name: Attest historical recovery checksum manifest
        if: ${{ needs.gate.outputs.historical_recovery == 'true' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/SHA256SUMS
          predicate-type: https://github.com/hunterchen7/viewr/attestations/release-recovery/v1
          predicate-path: ${{ runner.temp }}/viewr-release-recovery-predicate.json
      - name: Upload all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VIEWR_RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          VIEWR_RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
          VIEWR_RELEASE_QUERY_ATTEMPTS: "1"
        run: |
          git fetch \
            --force \
            --no-tags \
            origin \
            "refs/tags/$VIEWR_RELEASE_TAG:refs/tags/$VIEWR_RELEASE_TAG"
          current_release_sha="$(git rev-parse "$VIEWR_RELEASE_TAG^{commit}")"
          if [[ "$current_release_sha" != "$VIEWR_RELEASE_SHA" ]]; then
            echo "::error::Release tag moved from $VIEWR_RELEASE_SHA to $current_release_sha."
            exit 1
          fi
          scripts/require-draft-release.sh \
            "$VIEWR_RELEASE_TAG" \
            "$VIEWR_RELEASE_ID" >/dev/null
          scripts/upload-release-assets.sh \
            --release-id "$VIEWR_RELEASE_ID" \
            dist \
            "$VIEWR_RELEASE_TAG"
      - name: Verify uploaded release assets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIEWR_RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify-remote-release-assets.sh \
            --release-id "$VIEWR_RELEASE_ID" \
            dist \
            "$VIEWR_RELEASE_TAG"
      - name: Preserve validated historical recovery assets
        if: ${{ needs.gate.outputs.historical_recovery == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: historical-release-${{ needs.gate.outputs.release_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish validated release
        if: ${{ needs.gate.outputs.historical_recovery == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIEWR_RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          VIEWR_RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch \
            --force \
            --no-tags \
            origin \
            "refs/tags/$VIEWR_RELEASE_TAG:refs/tags/$VIEWR_RELEASE_TAG"
          current_release_sha="$(git rev-parse "$VIEWR_RELEASE_TAG^{commit}")"
          if [[ "$current_release_sha" != "$VIEWR_RELEASE_SHA" ]]; then
            echo "::error::Release tag moved from $VIEWR_RELEASE_SHA to $current_release_sha."
            exit 1
          fi
          scripts/publish-draft-release.sh \
            --asset-directory dist \
            --release-id "$VIEWR_RELEASE_ID" \
            --release-sha "$VIEWR_RELEASE_SHA" \
            "$VIEWR_RELEASE_TAG"
      - name: Preserve verified historical recovery draft
        if: ${{ needs.gate.outputs.historical_recovery == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIEWR_RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          VIEWR_RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          VIEWR_RELEASE_TAG: ${{ inputs.release_tag }}
          VIEWR_RELEASE_QUERY_ATTEMPTS: "1"
        run: |
          git fetch \
            --force \
            --no-tags \
            origin \
            "refs/tags/$VIEWR_RELEASE_TAG:refs/tags/$VIEWR_RELEASE_TAG"
          current_release_sha="$(git rev-parse "$VIEWR_RELEASE_TAG^{commit}")"
          if [[ "$current_release_sha" != "$VIEWR_RELEASE_SHA" ]]; then
            echo "::error::Release tag moved from $VIEWR_RELEASE_SHA to $current_release_sha."
            exit 1
          fi
          scripts/require-draft-release.sh \
            "$VIEWR_RELEASE_TAG" \
            "$VIEWR_RELEASE_ID" >/dev/null
          {
            echo "### Historical release recovery is ready"
            echo
            echo "Release \`$VIEWR_RELEASE_TAG\` (ID \`$VIEWR_RELEASE_ID\`) remains a verified draft."
            echo "A maintainer with a workflow-authorized token must publish this exact ID."
            echo
            echo '```bash'
            echo 'recovery_directory="$(mktemp -d)"'
            echo "gh run download \"$GITHUB_RUN_ID\" --repo \"$GITHUB_REPOSITORY\" \\"
            echo "  --name \"historical-release-$VIEWR_RELEASE_ID\" \\"
            echo '  --dir "$recovery_directory/assets"'
            echo "git clone --no-checkout \"https://github.com/$GITHUB_REPOSITORY.git\" \\"
            echo '  "$recovery_directory/release-tools"'
            echo "git -C \"\$recovery_directory/release-tools\" checkout --detach \"$GITHUB_SHA\""
            echo 'GH_TOKEN="$(gh auth token)" \'
            echo "GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\"
            echo "\"\$recovery_directory/release-tools/scripts/publish-draft-release.sh\" \\"
            echo '  --asset-directory "$recovery_directory/assets" \'
            echo "  --release-id \"$VIEWR_RELEASE_ID\" \\"
            echo "  --release-sha \"$VIEWR_RELEASE_SHA\" \\"
            echo "  --recovery-workflow-sha \"$GITHUB_SHA\" \\"
            echo "  \"$VIEWR_RELEASE_TAG\""
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::notice title=Historical recovery ready::Release $VIEWR_RELEASE_TAG (ID $VIEWR_RELEASE_ID) remains a verified draft for maintainer publication."
