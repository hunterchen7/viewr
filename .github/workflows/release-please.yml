name: release-please
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve release branch
        id: release_pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          release_branch="$(
            jq -er \
              '.headBranchName | strings | select(startswith("release-please--branches--"))' \
              <<< "$RELEASE_PR"
          )"
          printf 'branch=%s\n' "$release_branch" >> "$GITHUB_OUTPUT"
      - name: Check out release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
            submodules: true
          ref: ${{ steps.release_pr.outputs.branch }}
      - name: Install Rust
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
      - name: Sync release lockfile
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.branch }}
        run: |
          case "$RELEASE_BRANCH" in
            release-please--branches--*) ;;
            *)
              echo "::error::Unexpected release branch: $RELEASE_BRANCH"
              exit 1
              ;;
          esac

          cargo update --workspace
          cargo update \
            --manifest-path tools/jpeg-bakeoff/Cargo.toml \
            -p viewr-core

          if git diff --quiet -- Cargo.lock tools/jpeg-bakeoff/Cargo.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock tools/jpeg-bakeoff/Cargo.lock
          git commit -m "chore: sync release lockfiles"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - name: Run CI for release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release_pr.outputs.branch }}
        # GITHUB_TOKEN pushes do not trigger push workflows, but dispatches do.
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  release-assets:
    name: Validate and publish release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
