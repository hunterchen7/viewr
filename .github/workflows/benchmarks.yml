name: Benchmarks
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmarks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record environment
        run: |
          rustc -Vv
          uname -a
          lscpu
      - name: Run core synthetic benchmarks
        run: cargo bench -p viewr-core --features benchmarks --bench core_hot_paths --locked -- --noplot
      - name: Run filmstrip scaling benchmarks
        run: cargo bench -p viewr --features benchmarks --bench filmstrip_scaling --locked -- --noplot
      - name: Upload Criterion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}
          path: target/criterion
          if-no-files-found: warn
          retention-days: 14
