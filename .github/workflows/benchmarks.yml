name: Benchmarks
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: benchmarks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record benchmark environment
        shell: bash
        run: |
          rustc -Vv
          uname -a
          lscpu
          mkdir -p target
          bench_commit="$(git rev-parse HEAD)"
          bench_rust="$(rustc -Vv)"
          bench_os="$(uname -a)"
          bench_cpu="$(lscpu | awk -F: '/Model name/ {sub(/^[ \t]+/, "", $2); print $2; exit}')"
          bench_cores="$(nproc)"
          bench_memory="$(awk '/MemTotal/ {print $2 * 1024; exit}' /proc/meminfo)"
          bench_lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          jq -n \
            --arg commit "$bench_commit" \
            --arg cargo_lock_sha256 "$bench_lock_hash" \
            --arg rustc "$bench_rust" \
            --arg os "$bench_os" \
            --arg cpu "$bench_cpu" \
            --argjson logical_cores "$bench_cores" \
            --argjson memory_bytes "$bench_memory" \
            --arg rayon_threads "${RAYON_NUM_THREADS:-default}" \
            '{
              schema_version: 1,
              commit: $commit,
              cargo_lock_sha256: $cargo_lock_sha256,
              rustc: $rustc,
              os: $os,
              cpu: $cpu,
              logical_cores: $logical_cores,
              memory_bytes: $memory_bytes,
              rayon_threads: $rayon_threads,
              raw_fixture: null,
              cache_condition: "Criterion warm-up; operating-system cache not reset",
              power_mode: "GitHub-hosted runner (not controlled)"
            }' > target/benchmark-metadata.json
          cat target/benchmark-metadata.json
      - name: Run core synthetic benchmarks
        run: cargo bench -p viewr-core --features benchmarks --bench core_hot_paths --locked -- --noplot
      - name: Run filmstrip scaling benchmarks
        run: cargo bench -p viewr --features benchmarks --bench filmstrip_scaling --locked -- --noplot
      - name: Upload Criterion results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/criterion
            target/benchmark-metadata.json
          if-no-files-found: warn
          retention-days: 90
