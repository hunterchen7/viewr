name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Release Please dispatches CI after it updates Cargo.lock with GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check documentation
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check benchmark targets
        if: runner.os != 'Linux'
        run: cargo check --workspace --benches --all-features --locked
      - name: Report optional real-RAW fixture coverage
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          fixture_dir="testdata/real-raw-corpus"
          if [[ -f "$fixture_dir/HCA04875.ARW" && -f "$fixture_dir/HCA05417.ARW" ]]; then
            fixture_status="Available but not run: real-RAW tests are opt-in because they are marked ignored."
          else
            fixture_status="Not run: optional local RAW fixtures are absent, so the ignored real-RAW tests have no fixture coverage in this CI run."
          fi
          echo "::notice title=Optional real-RAW fixture tests::$fixture_status"
          {
            echo "### Optional real-RAW fixture coverage"
            echo
            echo "$fixture_status"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Release and benchmark builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: builds
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release and benchmark targets
        run: cargo build --workspace --release --bins --benches --all-features --locked
      - name: Test workspace release behavior
        run: cargo test --workspace --release --locked
      - name: Smoke-test optimized benchmark harnesses
        run: |
          cargo bench -p viewr-core --features benchmarks --bench core_hot_paths --locked -- --test
          cargo bench -p viewr --features benchmarks --bench filmstrip_scaling --locked -- --test

  miri:
    name: Miri unsafe-path checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-21
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check pixel rotations
        run: cargo +nightly-2026-07-21 miri test -p viewr-core --lib resize::tests::rotate_ --locked
      - name: Check superpixel output initialization
        run: cargo +nightly-2026-07-21 miri test -p viewr-core --lib develop::tests::superpixel_output_initialization_is_valid_under_miri --locked
