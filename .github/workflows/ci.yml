name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Release Please dispatches CI after it updates Cargo.lock with GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install license inventory tool
        run: cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Fetch all release target dependency graphs
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-pc-windows-msvc
          cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Validate third-party license inventories
        run: scripts/validate-third-party-licenses.sh
      - name: Test release asset verification
        run: scripts/test-verify-remote-release-assets.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check documentation
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check benchmark targets
        if: runner.os != 'Linux'
        run: cargo check --workspace --benches --all-features --locked
      - name: Report optional real-RAW fixture coverage
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          fixture_dir="testdata/real-raw-corpus"
          if [[ -f "$fixture_dir/HCA04875.ARW" && -f "$fixture_dir/HCA05417.ARW" ]]; then
            fixture_status="Available but not run: real-RAW tests are opt-in because they are marked ignored."
          else
            fixture_status="Not run: optional local RAW fixtures are absent, so the ignored real-RAW tests have no fixture coverage in this CI run."
          fi
          echo "::notice title=Optional real-RAW fixture tests::$fixture_status"
          {
            echo "### Optional real-RAW fixture coverage"
            echo
            echo "$fixture_status"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Release and benchmark builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: builds
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release and benchmark targets
        run: cargo build --workspace --release --bins --benches --all-features --locked
      - name: Test workspace release behavior
        run: cargo test --workspace --release --locked
      - name: Smoke-test optimized benchmark harnesses
        run: |
          cargo bench -p viewr-core --features benchmarks --bench core_hot_paths --locked -- --test
          cargo bench -p viewr --features benchmarks --bench filmstrip_scaling --locked -- --test

  installers:
    name: Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
          - platform: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - platform: Debian x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            desktop-file-utils \
            dpkg-dev \
            jq \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libvulkan1 \
            lintian \
            shared-mime-info \
            xdg-utils
      - uses: dtolnay/rust-toolchain@2fe4ca74464c5902a4f6e302d0a619b4ea911ccc # 1.96
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: installers-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Viewr
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p viewr --bin viewr
      - name: Build and validate macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/package-macos-pkg.sh \
            target/${{ matrix.target }}/release/viewr \
            dist/viewr-macos-arm64.pkg
          scripts/validate-macos-pkg.sh \
            --test-open-events \
            dist/viewr-macos-arm64.pkg
      - name: Build and validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-msi.ps1 `
            -BinaryPath "target/${{ matrix.target }}/release/viewr.exe" `
            -OutputDirectory dist
          ./scripts/test-windows-msi.ps1 `
            -MsiPath dist/viewr-windows-x64.msi `
            -ExpectedBinaryPath "target/${{ matrix.target }}/release/viewr.exe" `
            -AllowMachineChanges
      - name: Build and validate Debian installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/package-linux-deb.sh \
            --binary target/${{ matrix.target }}/release/viewr \
            --output-dir dist
          scripts/validate-linux-deb.sh dist/viewr-linux-x64.deb
          scripts/test-linux-deb-install.sh \
            --allow-system-changes \
            dist/viewr-linux-x64.deb
      - name: Build and validate release source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/package-source-archive.sh dist
          scripts/validate-source-archive.sh dist/viewr-*-source.tar.gz

  miri:
    name: Miri unsafe-path checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-07-21
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: miri
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check pixel rotations
        run: cargo +nightly-2026-07-21 miri test -p viewr-core --lib resize::tests::rotate_ --locked
      - name: Check superpixel output initialization
        run: cargo +nightly-2026-07-21 miri test -p viewr-core --lib develop::tests::superpixel_output_initialization_is_valid_under_miri --locked
